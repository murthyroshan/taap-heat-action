<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saathi — heat companion · Taap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🔥%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<style>
.sa{max-width:860px;margin:0 auto;padding:18px 16px 140px;display:grid;gap:14px}
.stage{position:relative;display:grid;place-items:center;height:250px}
#viz{width:250px;height:250px}
.stage .state{position:absolute;bottom:4px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.opt{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:13.5px;cursor:pointer}
.opt input{accent-color:var(--ember)}
.opt.on{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset}
.thread{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:12px 16px;border-radius:18px;font-size:16px;line-height:1.55;animation:pop .35s var(--ease) both;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--ember),var(--ember3));color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line2);border-bottom-left-radius:6px;backdrop-filter:blur(10px)}
.msg .eng{display:block;margin-top:6px;font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.04em}
.msg .replay{border:0;background:none;color:var(--ember2);cursor:pointer;font-weight:700;padding:0;margin-left:8px}
.cards{display:grid;gap:10px;align-self:stretch}
.c{border-radius:16px;padding:14px;background:var(--bg2);border:1px solid var(--line2);animation:pop .4s var(--ease) both}
.c h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.c.emerg{background:linear-gradient(140deg,#5c0b10,#2a0507);border-color:#ff3b30;color:#fff;animation:pop .3s both,alarm 1.4s ease-in-out infinite}
@keyframes alarm{50%{box-shadow:0 0 0 6px rgba(255,59,48,.35)}}
.c.emerg a.call{display:flex;justify-content:center;align-items:center;gap:10px;margin:10px 0;padding:16px;border-radius:14px;background:#ff3b30;color:#fff;font-size:24px;font-weight:800;text-decoration:none}
.c.emerg ol{margin:6px 0 0 18px;padding:0;line-height:1.7}
.c.warn{border-color:#ffcc00;background:rgba(255,204,0,.08)}
.strip{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:36px;align-items:end;margin:6px 0}
.strip div{border-radius:3px}
.strip div.now{outline:2px solid var(--ink)}
.prow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.prow:last-child{border-bottom:0}.prow.far{opacity:.6}
.prow b.m{font-size:17px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:900;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.dock .in{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dock input{flex:1;padding:14px 16px;border-radius:16px;border:1px solid var(--line2);background:var(--bg2);font-size:16px}
.mic{width:62px;height:62px;flex:none;border-radius:50%;border:0;cursor:pointer;font-size:26px;color:#fff;background:linear-gradient(135deg,var(--ember),var(--ember3));box-shadow:0 10px 30px -8px var(--glow);transition:transform .2s var(--ease)}
.mic:hover{transform:scale(1.06)}
.mic.live{animation:micPulse 1.2s ease-in-out infinite;background:linear-gradient(135deg,#ff2d55,#bf5af2)}
@keyframes micPulse{50%{box-shadow:0 0 0 14px rgba(255,45,85,.18)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:8px 13px;font-size:14px;cursor:pointer;color:var(--ink)}
.chips button:hover{border-color:var(--ember)}
.interim{min-height:22px;text-align:center;color:var(--muted);font-style:italic}
</style>
</head>
<body>
<div class="bgfx"></div>
<nav id="nav" data-page="saathi" data-city="1"></nav>
<div class="sa">
  <div class="stage"><canvas id="viz" width="500" height="500" aria-hidden="true"></canvas><div class="state" id="state">TAP THE MIC AND SPEAK</div></div>
  <div class="interim" id="interim"></div>
  <div class="opts">
    <span class="opt" id="langOpt"><button class="ghost" data-l="hi" style="padding:2px 8px">हिंदी</button><button class="ghost" data-l="en" style="padding:2px 8px">English</button></span>
    <select id="zone" class="ctl" aria-label="Area"></select>
    <label class="opt"><input type="checkbox" id="newW"> <span data-t="new">नया काम</span></label>
    <label class="opt"><input type="checkbox" id="hands"> <span data-t="hands">हैंड्स-फ़्री</span></label>
    <button class="opt" id="locate">📍 <span data-t="loc">मेरी जगह</span></button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="thread" id="thread"></div>
</div>
<div class="dock"><form class="in" id="form"><button type="button" class="mic" id="mic" aria-label="Speak">🎙️</button><input id="text" autocomplete="off" placeholder="बोलें या लिखें…"><button class="primary" style="padding:14px 18px">➤</button></form></div>
<script src="assets/core.js"></script>
<script>
const I18N = {
  hi:{new:'नया काम',hands:'हैंड्स-फ़्री',loc:'मेरी जगह',ph:'बोलें या लिखें…',listening:'सुन रहा हूँ…',thinking:'सोच रहा हूँ…',speaking:'बोल रहा हूँ…',idle:'माइक दबाएँ और बोलें',
      hello:'नमस्ते! मैं साथी हूँ। गर्मी, पानी, छाँव, काम के घंटे या कोई परेशानी — कुछ भी पूछें। माइक दबाकर बोलिए।',
      chips:['आज कितनी गर्मी है?','सबसे पास पानी कहाँ है?','आज कब काम करूँ?','साइट पर पानी नहीं है','ठेकेदार आराम नहीं देता','मुझे चक्कर आ रहा है'],
      walk:'मिनट',far:'दूर',risk:'आज का खतरा',places:'पास में मदद',shift:'सुरक्षित शिफ्ट',report:'शिकायत भेजी गई',rights:'आपके अधिकार',now:'अभी',sentTo:'भेजी गई:',dup:'यह शिकायत पहले ही भेजी जा चुकी है',nomic:'इस ब्राउज़र में आवाज़ से बोलना उपलब्ध नहीं — लिखकर पूछें',work:'मिनट काम',rest:'आराम',
      eng:{agent:'AI एजेंट · Strands',fallback:'ऑफ़लाइन नियम',triage:'सुरक्षा नियम — AI नहीं'}},
  en:{new:'New worker',hands:'Hands-free',loc:'My location',ph:'Speak or type…',listening:'LISTENING…',thinking:'THINKING…',speaking:'SPEAKING…',idle:'TAP THE MIC AND SPEAK',
      hello:"Hi, I'm Saathi. Ask me anything about today's heat, water, shade, when to work, or a problem at your site. Tap the mic and talk.",
      chips:['How hot is it today?','Where is the nearest water?','When should I work today?','There is no water at my site','Contractor won\'t let us rest','I feel dizzy'],
      walk:'min',far:'far',risk:'Today\'s risk',places:'Help nearby',shift:'Safe shift',report:'Report sent',rights:'Your rights',now:'now',sentTo:'Sent to',dup:'Already reported in the last 30 minutes',nomic:'Voice input is not available in this browser — type instead',work:'min work',rest:'rest',
      eng:{agent:'AI agent · Strands',fallback:'offline rules',triage:'safety rules — not AI'}},
};
let lang = T.store.get('taap.lang') || 'hi', here = null, mode = 'idle', rec = null, analyser = null, level = 0, lastReply = '';
const sid = T.store.get('taap.sid') || (() => { const s = Math.random().toString(36).slice(2,10); T.store.set('taap.sid', s); return s; })();
const L = k => I18N[lang][k];
function setState(m){ mode = m; T.$('#state').textContent = L(m==='idle'?'idle':m); T.$('#mic').classList.toggle('live', m==='listening'); }
function applyLang(){
  document.documentElement.lang = lang; document.body.classList.toggle('hi', lang==='hi');
  T.$$('#langOpt button').forEach(b => b.style.background = b.dataset.l===lang ? 'var(--ember)' : 'transparent');
  T.$$('[data-t]').forEach(el => el.textContent = L(el.dataset.t));
  T.$('#text').placeholder = L('ph'); setState(mode);
  T.$('#chips').innerHTML = L('chips').map(c => `<button type="button">${T.esc(c)}</button>`).join('');
  T.$$('#chips button').forEach(b => b.onclick = () => send(b.textContent));
  const c = T.cities[T.city()]; if(c){ const sel = T.$('#zone'), v = sel.value; sel.innerHTML = c.zones.map(z => `<option value="${z.id}">${T.esc(lang==='hi'?z.name_hi:z.name)}</option>`).join(''); if(v) sel.value = v; }
}

/* ---------- voice orb ---------- */
(function viz(){
  const cv = T.$('#viz'), ctx = cv.getContext('2d'); let t = 0;
  (function frame(){
    t += .016; const W = cv.width, H = cv.height, cx = W/2, cy = H/2; ctx.clearRect(0,0,W,H);
    let amp = mode==='listening' ? level : mode==='speaking' ? .35 + .25*Math.abs(Math.sin(t*7))*Math.abs(Math.sin(t*2.3)) : mode==='thinking' ? .18 : .08 + .04*Math.sin(t*1.5);
    if(T.REDUCED) amp = .1;
    const R = 120 + amp*60, hue = mode==='listening' ? 340 : 22;
    const g = ctx.createRadialGradient(cx-30, cy-40, 10, cx, cy, R*1.5);
    g.addColorStop(0, `hsla(${hue+25},100%,85%,1)`); g.addColorStop(.35, `hsla(${hue+10},100%,58%,1)`); g.addColorStop(.75, `hsla(${hue-10},90%,45%,.9)`); g.addColorStop(1, `hsla(${hue-20},90%,30%,0)`);
    ctx.beginPath();
    for(let i=0;i<=120;i++){ const a = i/120*Math.PI*2, wob = Math.sin(a*5+t*3)*amp*18 + Math.sin(a*3-t*2)*amp*12 + (mode==='thinking'?Math.sin(a*8+t*9)*6:0);
      const r = R + wob; const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r; i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
    ctx.closePath(); ctx.fillStyle = g; ctx.shadowBlur = 60; ctx.shadowColor = `hsla(${hue},100%,55%,.7)`; ctx.fill(); ctx.shadowBlur = 0;
    for(let k=1;k<=3;k++){ ctx.beginPath(); ctx.arc(cx, cy, R + 18*k + amp*30*k, 0, Math.PI*2); ctx.strokeStyle = `hsla(${hue},100%,60%,${.18/k})`; ctx.lineWidth = 2; ctx.stroke(); }
    requestAnimationFrame(frame);
  })();
})();
async function micLevel(on){
  if(!on){ level = 0; return; }
  try{ const stream = await navigator.mediaDevices.getUserMedia({audio:true}); const ac = new (window.AudioContext||window.webkitAudioContext)();
    analyser = ac.createAnalyser(); analyser.fftSize = 512; ac.createMediaStreamSource(stream).connect(analyser); const buf = new Uint8Array(analyser.fftSize);
    (function tick(){ if(mode!=='listening'){ stream.getTracks().forEach(t => t.stop()); ac.close(); level = 0; return; }
      analyser.getByteTimeDomainData(buf); let s = 0; for(const v of buf){ const d = (v-128)/128; s += d*d; } level = Math.min(1, Math.sqrt(s/buf.length)*4); requestAnimationFrame(tick); })();
  }catch(e){ level = .2; }
}

/* ---------- speech ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen(){
  if(!SR){ T.toast(L('nomic'),'bad'); T.$('#text').focus(); return; }
  if(mode==='listening'){ rec && rec.stop(); return; }
  speechSynthesis.cancel();
  rec = new SR(); rec.lang = lang==='hi' ? 'hi-IN' : 'en-IN'; rec.interimResults = true; rec.maxAlternatives = 1;
  let final = '';
  rec.onresult = e => { let interim = ''; for(const r of e.results){ (r.isFinal ? (final = r[0].transcript) : (interim += r[0].transcript)); } T.$('#interim').textContent = interim || final; };
  rec.onerror = e => { setState('idle'); if(e.error !== 'no-speech' && e.error !== 'aborted') T.toast('Mic: '+e.error,'bad'); };
  rec.onend = () => { T.$('#interim').textContent = ''; if(final.trim()) send(final.trim()); else if(mode==='listening') setState('idle'); };
  setState('listening'); micLevel(true); rec.start();
}
function speak(text){
  if(!('speechSynthesis' in window) || !text) return afterSpeak();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,''));
  u.lang = lang==='hi' ? 'hi-IN' : 'en-IN'; u.rate = lang==='hi' ? .95 : 1;
  const vs = speechSynthesis.getVoices(); const v = vs.find(v => v.lang.toLowerCase().startsWith(lang==='hi'?'hi':'en-in')) || vs.find(v => v.lang.toLowerCase().startsWith(lang));
  if(v) u.voice = v;
  u.onstart = () => setState('speaking'); u.onend = u.onerror = afterSpeak;
  speechSynthesis.speak(u);
}
function afterSpeak(){ setState('idle'); if(T.$('#hands').checked && SR) setTimeout(listen, 350); }

/* ---------- conversation ---------- */
function bubble(cls, html){ const d = document.createElement('div'); d.className = 'msg '+cls; d.innerHTML = html; T.$('#thread').append(d); d.scrollIntoView({behavior:'smooth', block:'end'}); return d; }
function card(c){
  const bc = T.bandColors(), B = T.bands, nowH = +new Date().toLocaleString('en-GB',{hour:'2-digit',hour12:false,timeZone:'Asia/Kolkata'});
  if(c.type==='emergency') return `<div class="c emerg"><b style="font-size:20px">${T.esc(c.title)}</b><a class="call" href="tel:112">📞 ${T.esc(c.call)}</a><ol>${c.steps.map(s=>`<li>${T.esc(s)}</li>`).join('')}</ol></div>`;
  if(c.type==='warning') return `<div class="c warn">⚠️ ${T.esc(c.text)}</div>`;
  if(c.type==='risk'){ const r = c.risk, b = B[r.band];
    return `<div class="c"><h4>${L('risk')} · ${T.esc(lang==='hi'?c.zone.name_hi:c.zone.name)}</h4><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${T.pill((lang==='hi'?b.label_hi:b.label), bc[r.band], r.band===4)}<span class="note">WBGT ${r.peak_wbgt}° · ${r.tmax}°C${r.start?` · ${r.start}–${r.end}`:''}</span></div>
      <div class="strip">${r.hourly.map(h => `<div class="${h.hour===nowH?'now':''}" title="${h.hour}:00 WBGT ${h.wbgt}°" style="height:${20+80*Math.max(0,(h.wbgt-18))/16}%;background:${bc[h.band]}"></div>`).join('')}</div></div>`; }
  if(c.type==='places'){ const IC = {water:'💧',cool:'⛱️',health:'🏥'}; const rows = Object.entries(c.places).flatMap(([k,v]) => v.map(p => ({...p,k})));
    return `<div class="c"><h4>${L('places')}</h4>${rows.map(p => `<a class="prow${p.too_far?' far':''}" href="${p.directions}" target="_blank" rel="noopener"><span>${IC[p.k]}</span><span>${T.esc(p.n)}${p.official?' ✅':''}<div class="note">${(p.dist_m/1000).toFixed(1)} km${p.too_far?' · ⚠️ '+L('far'):''}</div></span><b class="m">${p.walk_min} ${L('walk')}</b></a>`).join('') || '—'}</div>`; }
  if(c.type==='shift'){ const p = c.plan;
    return `<div class="c"><h4>${L('shift')} · ${p.start||'–'} → ${p.finish||'–'}</h4>${p.rows.filter(r=>r.work).map(r => `<div class="prow" style="grid-template-columns:60px 14px 1fr"><span class="note">${String(r.hour).padStart(2,'0')}:00</span><span style="width:12px;height:12px;border-radius:3px;background:${bc[r.band]}"></span><span><b>${r.work} ${L('work')}</b>${r.rest?` · ${r.rest} ${L('rest')}`:''}</span></div>`).join('')}</div>`; }
  if(c.type==='report') return `<div class="c" style="border-color:var(--b0)">✅ <b>${c.duplicate ? L('dup') : `${L('report')} · ${L('sentTo')} ${T.esc(c.department)}`}</b></div>`;
  if(c.type==='rights') return `<div class="c"><h4>${L('rights')}</h4>${T.esc(c.text)}</div>`;
  return '';
}
async function send(text){
  text = (text||'').trim(); if(!text) return;
  T.$('#text').value = ''; bubble('me', T.esc(text)); setState('thinking');
  const wait = bubble('ai', '<span class="typing"><i></i><i></i><i></i></span>');
  try{
    const r = await T.api('/api/saathi', {text, city:T.city(), zone:T.$('#zone').value, lang, new:T.$('#newW').checked, session:sid, ...(here?{lat:here[0],lon:here[1]}:{})});
    lastReply = r.reply;
    wait.innerHTML = `${T.esc(r.reply)}<button class="replay" title="Play again">🔊</button><span class="eng">${T.esc(L('eng')[r.engine]||r.engine)}</span>`;
    wait.querySelector('.replay').onclick = () => speak(r.reply);
    if(r.cards && r.cards.length){ const d = document.createElement('div'); d.className = 'cards'; d.innerHTML = r.cards.map(card).join(''); T.$('#thread').append(d); d.scrollIntoView({behavior:'smooth', block:'end'}); }
    if(r.emergency && navigator.vibrate) navigator.vibrate([300,150,300,150,600]);
    speak(r.reply);
  }catch(e){ wait.textContent = e.message; setState('idle'); }
}

(async function(){
  await T.nav({onCity: applyLang});
  T.$('#newW').checked = T.store.get('taap.new') === '1'; T.$('#newW').onchange = () => T.store.set('taap.new', T.$('#newW').checked ? '1' : '');
  T.$$('#langOpt button').forEach(b => b.onclick = () => { lang = b.dataset.l; T.store.set('taap.lang', lang); applyLang(); });
  applyLang();
  const saved = T.store.get('taap.zone.'+T.city()); if(saved) T.$('#zone').value = saved;
  T.$('#zone').onchange = () => { here = null; T.store.set('taap.zone.'+T.city(), T.$('#zone').value); };
  T.$('#mic').onclick = listen;
  T.$('#form').onsubmit = e => { e.preventDefault(); send(T.$('#text').value); };
  T.$('#locate').onclick = () => navigator.geolocation && navigator.geolocation.getCurrentPosition(p => { here = [p.coords.latitude, p.coords.longitude]; T.$('#locate').classList.add('on'); T.toast('📍 ✓','good'); }, () => T.toast('Location unavailable','bad'), {timeout:8000});
  if('speechSynthesis' in window) speechSynthesis.getVoices();
  bubble('ai', T.esc(L('hello')));
  if(T.STATIC) bubble('ai', 'This is a read-only demo snapshot — Saathi answers in the live app.');
  T.buttons();
})();
</script>
</body>
</html>
