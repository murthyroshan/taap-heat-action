name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-local.txt pytest boto3 cfn-lint
      - name: Unit tests
        run: python -m pytest -q
      - name: Check the AWS SAM template
        run: cfn-lint template.yaml
